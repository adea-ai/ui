<!-- @dsCard group="Theming" height=500 -->
<style>
  /* Workaround, remove when fixed in source: the option button keeps both h-control-sm and
     h-auto after cn(), h-control-sm wins, and the 28px button squashes each ThemePreview. */
  [data-slot='theme-picker'] > [role='radio'] { height: auto; }
</style>
<div id="root" style="padding:16px"></div>
<script>
  const { render, html, createSignal, ThemePicker, themesForAppearance, defaultThemeSelection } = window.AdeaUI;
  // A picker lists one appearance at a time; this one follows the page's.
  const appearance = (document.documentElement.dataset.theme || 'light').startsWith('dark') ? 'dark' : 'light';
  const all = themesForAppearance(appearance);
  const themes = all.slice(0, 10);
  const [selected, setSelected] = createSignal(appearance === 'dark' ? defaultThemeSelection.darkThemeId : defaultThemeSelection.lightThemeId);
  const caption = 'font-family:var(--font-mono);font-size:12px;color:var(--muted-foreground)';
  render(() => html`
<div style="display:flex;flex-direction:column;gap:12px">
  <code style=${caption}>${`${themes.length} of ${all.length} ${appearance} themes · selected: `}${selected}</code>
  <${ThemePicker} themes=${themes} selectedId=${() => selected()} onThemeSelect=${(theme) => setSelected(theme.id)} />
</div>
`, document.getElementById('root'));
</script>
