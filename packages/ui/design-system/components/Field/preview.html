    render,
    html,
    Icons,
    Field,
    FieldLabel,
    FieldInput,
    FieldDescription,
    FieldError,
    FieldTextArea,
    FieldGroup,
  } = window.AdeaUI
  render(
    () => html`
      <div style="display:flex;flex-direction:column;gap:16px;width:384px">
        <${Field}
          ><${FieldLabel}>Workspace name<//><${FieldInput} placeholder="Adea" /><${FieldDescription}

          ><//
        >
        <${Field} validationState="invalid"

          ><//
        >
        <${Field}

      <${FieldGroup} columns=${2} style="width:576px">

          ><${FieldLabel}>Model<//><${FieldInput} placeholder="nomic-embed-text" /><//

      <//>
