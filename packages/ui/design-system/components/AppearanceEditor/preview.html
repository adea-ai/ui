<!-- @dsCard group="Composites" height=860 -->
<div id="root" style="padding:16px;display:flex;flex-direction:column;gap:12px"></div>
<script>
  const { render, html, createSignal, createMemo, AppearanceEditor, themeRecordById, appearancePreviewThemes, accentPresets } = window.AdeaUI;
  // The editor takes the catalogue's own theme records, which the bundle exports as
  // themeRecords / themeRecordById; appearancePreviewThemes resolves a draft's ids and
  // accent (a preset or one the theme pair carries) into the two preview themes.
  const ids = ['adea-light', 'adea-dark', 'ayu', 'ayu-light', 'ayu-mirage', 'catppuccin-frappe', 'catppuccin-latte',
    'catppuccin-macchiato', 'catppuccin-mocha', 'dracula', 'everforest-dark', 'everforest-light', 'gruvbox-dark', 'gruvbox-light'];
  const themes = ids.map(themeRecordById).filter(Boolean);
  const accentOptions = accentPresets.filter((preset) => preset.id !== 'theme');
  const defaults = {
    mode: 'system', lightThemeId: 'adea-light', darkThemeId: 'adea-dark',
    terminalThemeId: 'theme', accent: 'theme', surface: 'theme', reduceTransparency: false,
  };
  render(() => {
    const [draft, setDraft] = createSignal({ ...defaults });
    const preview = createMemo(() => appearancePreviewThemes(draft()));
    return html`
<div style="width:100%;max-width:512px">
  <${AppearanceEditor}
    draft=${() => draft()}
    lightTheme=${() => preview().lightTheme}
    darkTheme=${() => preview().darkTheme}
    resolvedAppearance="dark"
    themes=${themes}
    accentOptions=${accentOptions}
    surfaceCapability=${{ frosted: false, reason: 'Transparency is unavailable on this host.' }}
    onChange=${(patch) => setDraft((value) => ({ ...value, ...patch }))}
    onReset=${(_event) => setDraft({ ...defaults })}
    onCancel=${(_event) => setDraft({ ...defaults })}
    onSave=${(_event) => {}}
  />
</div>`;
  }, document.getElementById('root'));
</script>
