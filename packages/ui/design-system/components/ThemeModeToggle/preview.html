<!-- @dsCard group="Theming" height=236 -->
<div id="root" style="padding:16px"></div>
<script>
  const { render, html, createSignal, ThemeModeToggle } = window.AdeaUI;
  const caption = 'font-family:var(--font-mono);font-size:12px;color:var(--muted-foreground)';
  const [mode, setMode] = createSignal('system');
  const [labelled, setLabelled] = createSignal('dark');
  render(() => html`
<div style="display:flex;flex-direction:column;gap:20px">
  <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">
    <code style=${caption}>controlled · ${mode}</code>
    <${ThemeModeToggle} mode=${() => mode()} onModeChange=${(next) => setMode(next)} />
  </div>
  <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">
    <code style=${caption}>withLabels</code>
    <${ThemeModeToggle} mode=${() => labelled()} onModeChange=${(next) => setLabelled(next)} withLabels=${true} />
  </div>
  <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">
    <code style=${caption}>disabled</code>
    <${ThemeModeToggle} mode="system" onModeChange=${(next) => {}} disabled=${true} />
  </div>
</div>
`, document.getElementById('root'));
</script>
