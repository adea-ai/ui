<div id="root" style="padding: 16px; display: flex; flex-direction: column; gap: 12px"></div>
<script>
  const { render, html, Icons, Slider } = window.AdeaUI
  render(
    () => html`
      <div style="display:flex;flex-direction:column;gap:20px;width:320px">
        <${Slider} defaultValue=${[40]} valueLabel=${true} aria-label="Zoom" />
        <${Slider} defaultValue=${[75]} disabled=${true} aria-label="Not available" />
      </div>
    `,
    document.getElementById('root')
  )
</script>
