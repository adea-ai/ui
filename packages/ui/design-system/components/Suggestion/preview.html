<!-- @dsCard group="Conversation" height=210 -->
<div id="root" style="padding:16px;max-width:560px;display:flex;flex-direction:column;gap:16px"></div>
<script>
  const { render, html, createSignal, Suggestions, Suggestion } = window.AdeaUI
  const prompts = ['Summarise the open risks', 'Draft the release notes', 'Explain this stack trace', 'Write a test for the parser', 'What changed since Monday?']
  render(() => {
    const [chosen, setChosen] = createSignal('')
    return html`
      <${Suggestions} onSelect=${(text) => setChosen(text)}>
        ${() => prompts.map((text) => html`<${Suggestion} text=${text} />`)}
      <//>
      <p style="margin:0;font-size:12px;color:var(--muted-foreground)" role="status">${() => (chosen() ? 'Chosen: ' + chosen() : 'Nothing chosen yet.')}</p>
      <${Suggestions} disabledReason="Wait for the current reply to finish before choosing a suggestion.">
        ${() => prompts.slice(0, 3).map((text) => html`<${Suggestion} text=${text} />`)}
      <//>
    `
  }, document.getElementById('root'))
</script>
