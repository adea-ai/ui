<!-- @dsCard group="Feedback" height=300 -->
<div id="root" style="padding:16px;display:flex;flex-direction:column;gap:12px"></div>
<script>
  const { render, html, Button, Toaster, toast } = window.AdeaUI;
  // solid-js/html reads a zero-argument function prop as a getter, so handlers take an argument.
  const raise = (_event) => {
    toast.success('Worktree created', { description: 'CoW · 0ms', persistent: true });
    toast.show({
      title: 'Session archived',
      description: 'worktree evidence · 14 messages',
      persistent: true,
      action: html`<${Button} size="xs" variant="outline" onClick=${(_event) => toast.clear()}>Undo<//>`,
    });
  };
  render(() => html`
<div>
  <${Button} variant="outline" size="sm" onClick=${raise}>Raise toasts<//>
  <!-- The region is fixed with no inset of its own, so the card pins it to the documented bottom-right. -->
  <${Toaster} style="right:0;bottom:0" />
</div>
`, document.getElementById('root'));
  raise();
</script>
