        <//>
      <//>
      <${PanelToolbar}>

        <span style="font-size:12px;color:var(--muted-foreground)">zsh</span>
      <//>
      <${PanelBody} bare=${true}>
        <pre style="margin:0;padding:12px;font-family:var(--font-mono);font-size:12px;line-height:1.6">$ bun test packages/ui/tests

    <div style="flex:1;display:flex;overflow:hidden;border-radius:var(--radius-xl);background:var(--surface-sunken)">
