<!-- @dsCard group="Data display" height=384 -->
<div id="root" style="padding:16px;display:flex;flex-direction:column;gap:12px"></div>
<script>
  const { render, html, ChartFrame, LineChart, BarChart } = window.AdeaUI;
  // Series colours are tokens; the chart resolves them on its own element, so it
  // follows the theme switcher without help.
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
  render(() => html`
<div style="display:flex;gap:16px;align-items:stretch;flex-wrap:wrap">
  <div style="width:500px">
    <${ChartFrame} class="grid-cols-1" title="Sessions per month" description="Rolling six months.">
      <${LineChart}
        labels=${months}
        series=${[
          { label: 'Desktop', data: [12, 19, 14, 22, 28, 31], color: 'var(--chart-1)' },
          { label: 'Web', data: [8, 9, 13, 11, 15, 17], color: 'var(--chart-2)' },
        ]}
        options=${{ animation: false }}
      />
    <//>
  </div>
  <div style="width:380px">
    <${ChartFrame} class="grid-cols-1" title="Turns by harness">
      <${BarChart}
        stacked=${true}
        labels=${['M12', 'M13', 'M14', 'M15']}
        series=${[
          { label: 'Pi', data: [40, 52, 61, 70], color: 'var(--chart-1)' },
          { label: 'Codex', data: [22, 31, 28, 34], color: 'var(--chart-2)' },
        ]}
        options=${{ animation: false }}
      />
    <//>
  </div>
</div>
`, document.getElementById('root'));
</script>
