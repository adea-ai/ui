version: 1
profile: monorepo
languages: typescript
features: validation,release
codeql: auto
dependency_review: auto
package_manager: bun
runtime_repository: 0xPlayerOne/code-foundry
runtime_ref: v1.33.1
runner: ubuntu-latest
ci_runner: ubuntu-latest
test_runner: ubuntu-latest
unit_runner: ubuntu-latest
security_runner: ubuntu-latest
codeql_runner: ubuntu-latest
pr_runner: ubuntu-latest
release_runner: ubuntu-latest
toolchain: auto
prune_standard: false
cache_packages: auto
cache_build: auto
# Two lanes own correctness here and the coverage denominator spans both, so the
# threshold is a blend rather than a number either lane could hit alone.
#
# `bun test` is the contract lane: tokens, themes, variants, the registry, and the
# generated theme script. It reaches 95-100% on every file it actually asserts.
#
# The component layer is the Workshop lane's job — `design-system-gates.yml` loads
# every story in a real browser and asserts accessibility and interaction. Those
# files still enter the LCOV denominator because the contract tests import the
# component barrel transitively, so the blended figure lands near 71%.
#
# 80 was never reachable and was never enforced, because the root `test:coverage`
# script resolved `solid-js/web` to the server build: the run threw before it could
# write a report, so the gate saw no evidence at all rather than a real number.
# 70 is the measured floor, and it keeps the gate live so the contract layer cannot
# regress unnoticed.
coverage_minimum: 70
turbo_remote: auto
release_type: node
npm_publish: false
post_release: false
post_release_workflow:
post_release_mode: auto
sync_mode: overlay
custom_workflows: preserve
license: apache-2.0
git_workflow: direct
merge_strategy: squash
release_merge_strategy: squash
opencode_security_model:
performance_runner: ubuntu-latest
performance: auto
performance_command:
performance_profile:
performance_budget_file:
draft_protection: true
required_capabilities:
coverage_enforcement: auto
coverage_metrics: lines
coverage_report:
