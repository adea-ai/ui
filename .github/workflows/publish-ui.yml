name: Publish the design system

# Publishes `packages/ui` to the public npm registry as `@adea-ai/ui`.
#
# This is a repository-local publisher rather than the shared Code Foundry
# `npm_publish` path, and the reason is structural rather than a preference.
# Code Foundry publishes *the repository root*: its release job runs
# `npm publish` with no `working-directory`, and it infers the release type from
# a `package.json` in the root. This repository's root manifest is
# `adea-ui` with `"private": true`, so `npm_publish: true` there fails with
# `EPRIVATE` — it would try to publish the monorepo root under the wrong name.
# The publishable artifact is `packages/ui`, which is a workspace member, so it
# is published from its own directory here.
#
# It runs on a release tag rather than on every push, because the version is
# stamped into `packages/ui/package.json` by the Release Please PR. A tag means
# exactly one thing happened: a release was merged, and this is that release.
#
# `packages/ui/dist` is gitignored and there is no `prepublishOnly` hook, so the
# build is this workflow's responsibility. Skipping it publishes a tarball whose
# `exports` map points at `./dist/index.js` and does not contain it — a package
# that installs and then fails to resolve its own entry point.
#
# ## Why the publish is OIDC and not the org token
#
# `@adea-ai/ui` has a trusted publisher configured on npm for *this* repository,
# so the publish authenticates with the run's OIDC identity and npm mints a
# short-lived token from it. That is the path this workflow takes, and it is
# also why `NPM_TOKEN` is deliberately not injected: the org secret is available
# here, and setting it would silently win over trusted publishing, handing the
# release a long-lived credential it no longer needs and masking a broken
# trusted-publisher configuration behind a token that still works.
#
# Trusted publishing needs npm 11.5.1 or newer. The version is pinned below
# rather than trusted to whatever the runner image ships.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, verify and pack without publishing
        type: boolean
        default: true
      method:
        description: How to authenticate to the registry
        type: choice
        options:
          - oidc
          - token
        default: oidc

# The publish steps are guarded by `inputs.dry-run != true`, never by
# `!= false`, and the difference is the whole behaviour of this workflow.
#
# A tag push has no `inputs` at all, so `inputs.dry-run` is `null`. GitHub coerces
# a null against a boolean by casting both to a number, so `null` and `false` are
# the *same value* to that comparison: `null != false` is false. Guarding on
# `!= false` therefore skips the publish on exactly the event it exists for, and
# `!= true` is what actually means "publish unless someone explicitly asked for a
# dry run".
#
# It failed silently — the run was green, the gates were green, and nothing was
# published — which is why this is written down rather than left as a condition to
# re-derive. A workflow whose success cannot be distinguished from a workflow that
# did nothing needs its intent in the file, not just in the reader's head.

permissions:
  contents: read

# One publisher at a time. A re-run of an old tag must not interleave with the
# next release's publish and leave `latest` pointing at the wrong line.
concurrency:
  group: publish-adea-ai-ui
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare @adea-ai/ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      archive_sha256: ${{ steps.archive.outputs.sha256 }}
      archive_integrity: ${{ steps.archive.outputs.integrity }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The tarball must contain dist/: exports serve ./dist/index.js and
      # ./dist/index.d.ts to registry consumers, and dist/ is gitignored.
      - name: Build the library
        run: bun run --cwd packages/ui build

      - name: Read the version to publish
        id: version
        working-directory: packages/ui
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish a version that already exists
        if: ${{ inputs.dry-run != true }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@adea-ai/ui@${VERSION}" version >/dev/null 2>&1; then
            echo "::error title=Version already published::@adea-ai/ui@${VERSION} is already on the registry. Versions are immutable; bump the manifest and merge a new release instead of retagging."
            exit 1
          fi
          echo "@adea-ai/ui@${VERSION} is available"

      - name: Verify the publishable archive
        working-directory: packages/ui
        run: bun run pack:check

      - name: Pack one immutable UI archive
        id: archive
        working-directory: packages/ui
        run: node scripts/prepare-packed-ui.mjs "$RUNNER_TEMP/prepared-ui"

      - name: Verify packed consumers
        working-directory: packages/ui
        env:
          ADEA_PACKED_UI_TARBALL: ${{ runner.temp }}/prepared-ui/package.tgz
          ADEA_PACKED_UI_SHA256: ${{ steps.archive.outputs.sha256 }}
        run: bun run check:packed-consumer

      - name: Verify packed pure paste model
        working-directory: packages/ui
        env:
          ADEA_PACKED_UI_TARBALL: ${{ runner.temp }}/prepared-ui/package.tgz
          ADEA_PACKED_UI_SHA256: ${{ steps.archive.outputs.sha256 }}
        run: bun run check:packed-paste-model

      - name: Upload the verified UI package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prepared-ui-package
          path: ${{ runner.temp }}/prepared-ui/
          retention-days: 1
          if-no-files-found: error

  packed-conversation:
    name: Packed conversation
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADEA_PACKED_UI_TARBALL: ${{ github.workspace }}/prepared-ui/package.tgz
      ADEA_PACKED_UI_SHA256: ${{ needs.prepare.outputs.archive_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the verified UI package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: prepared-ui-package
          path: ${{ github.workspace }}/prepared-ui/

      - name: Verify the shared archive
        run: |
          printf '%s  %s\n' "$ADEA_PACKED_UI_SHA256" "$ADEA_PACKED_UI_TARBALL" | sha256sum --check

      - name: Install headless engines
        run: bunx playwright install --with-deps chromium webkit

      - name: Verify packed conversation composition
        working-directory: packages/ui
        run: bun run check:packed-conversation

  packed-layout:
    name: Packed layout
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADEA_PACKED_UI_TARBALL: ${{ github.workspace }}/prepared-ui/package.tgz
      ADEA_PACKED_UI_SHA256: ${{ needs.prepare.outputs.archive_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the verified UI package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: prepared-ui-package
          path: ${{ github.workspace }}/prepared-ui/

      - name: Verify the shared archive
        run: |
          printf '%s  %s\n' "$ADEA_PACKED_UI_SHA256" "$ADEA_PACKED_UI_TARBALL" | sha256sum --check

      - name: Install headless engines
        run: bunx playwright install --with-deps chromium webkit

      - name: Verify packed pane model and renderer
        working-directory: packages/ui
        run: bun run check:packed-layout && bun run check:packed-layout-renderer

  packed-appearance:
    name: Packed appearance
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADEA_PACKED_UI_TARBALL: ${{ github.workspace }}/prepared-ui/package.tgz
      ADEA_PACKED_UI_SHA256: ${{ needs.prepare.outputs.archive_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the verified UI package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: prepared-ui-package
          path: ${{ github.workspace }}/prepared-ui/

      - name: Verify the shared archive
        run: |
          printf '%s  %s\n' "$ADEA_PACKED_UI_SHA256" "$ADEA_PACKED_UI_TARBALL" | sha256sum --check

      - name: Install headless engines
        run: bunx playwright install --with-deps chromium webkit

      - name: Verify packed appearance interactions and SSR
        working-directory: packages/ui
        run: bun run check:packed-appearance

  packed-native-select:
    name: Packed native select
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADEA_PACKED_UI_TARBALL: ${{ github.workspace }}/prepared-ui/package.tgz
      ADEA_PACKED_UI_SHA256: ${{ needs.prepare.outputs.archive_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the verified UI package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: prepared-ui-package
          path: ${{ github.workspace }}/prepared-ui/

      - name: Verify the shared archive
        run: |
          printf '%s  %s\n' "$ADEA_PACKED_UI_SHA256" "$ADEA_PACKED_UI_TARBALL" | sha256sum --check

      - name: Install headless engines
        run: bunx playwright install --with-deps chromium webkit

      - name: Verify native select from the packed artifact
        working-directory: packages/ui
        run: bun run check:packed-native-select

  publish:
    name: Publish @adea-ai/ui
    if: ${{ inputs.dry-run != true }}
    needs:
      - prepare
      - packed-conversation
      - packed-layout
      - packed-appearance
      - packed-native-select
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Only the final publisher receives an OIDC identity for npm trusted publishing.
      id-token: write
    env:
      PUBLISH_METHOD: ${{ inputs.method || 'oidc' }}
      NPM_TOKEN: ${{ inputs.method == 'token' && secrets.NPM_TOKEN || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing is implemented in the npm CLI, not in a GitHub
      # action, and it landed in 11.5.1. Older npm ignores the OIDC token and
      # falls back to anonymous, which fails with a 401 that reads like a
      # permissions problem rather than a version problem.
      - name: Pin an npm that can do trusted publishing
        run: |
          set -euo pipefail
          needed="11.5.1"
          if [ "$(printf '%s\n%s\n' "$needed" "$(npm --version | cut -d. -f1-2)" | sort -V | head -1)" != "$needed" ]; then
            echo "::error title=npm is too old for trusted publishing::needs >= ${needed}, runner has $(npm --version)"
            exit 1
          fi
          npm --version

      - name: Report the authentication method
        run: |
          echo "publishing with: ${PUBLISH_METHOD}"
          if [ "${PUBLISH_METHOD}" = "oidc" ] && [ -n "${NPM_TOKEN}" ]; then
            echo "::error title=Trusted publishing would be bypassed::PUBLISH_METHOD is oidc but NPM_TOKEN is set, so the token path would win. Unset the org secret for this job."
            exit 1
          fi

      - name: Download the verified UI package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: prepared-ui-package
          path: ${{ runner.temp }}/prepared-ui/

      - name: Verify the exact release archive
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_SHA256: ${{ needs.prepare.outputs.archive_sha256 }}
          EXPECTED_INTEGRITY: ${{ needs.prepare.outputs.archive_integrity }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/prepared-ui/package.tgz"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$archive" | sha256sum --check
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync } from 'node:fs'
          const archivePath = process.env.RUNNER_TEMP + '/prepared-ui/package.tgz'
          const bytes = readFileSync(archivePath)
          const manifest = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/prepared-ui/manifest.json', 'utf8'))
          const sha256 = createHash('sha256').update(bytes).digest('hex')
          const integrity = 'sha512-' + createHash('sha512').update(bytes).digest('base64')
          if (manifest.name !== '@adea-ai/ui' || manifest.version !== process.env.EXPECTED_VERSION)
            throw new Error('Prepared package identity does not match release version')
          if (sha256 !== process.env.EXPECTED_SHA256 || manifest.sha256 !== sha256)
            throw new Error('Prepared package SHA-256 does not match the verified artifact')
          if (integrity !== process.env.EXPECTED_INTEGRITY || manifest.integrity !== integrity)
            throw new Error('Prepared package npm integrity does not match the verified artifact')
          console.log(JSON.stringify({ name: manifest.name, version: manifest.version, sha256, integrity, size: bytes.byteLength }))
          NODE

      # Two steps rather than one conditional command, so a failure names the
      # method that failed instead of reporting a bare 401.
      - name: Publish (trusted publishing)
        if: ${{ env.PUBLISH_METHOD == 'oidc' }}
        run: npm publish "$RUNNER_TEMP/prepared-ui/package.tgz" --access public --provenance

      - name: Publish (org token)
        if: ${{ env.PUBLISH_METHOD == 'token' }}
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: npm publish "$RUNNER_TEMP/prepared-ui/package.tgz" --access public --provenance

      - name: Confirm the release is what consumers get
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # latest is the tag every unpinned install resolves, so it must match.
          # Keep polling: npm may acknowledge a successful publish before the
          # latest dist-tag is readable from every registry endpoint.
          for attempt in $(seq 1 20); do
            latest="$(npm view @adea-ai/ui dist-tags.latest 2>/dev/null || echo '')"
            echo "attempt ${attempt}/20: latest is ${latest:-<unreadable>}"
            if [ "${latest}" = "${VERSION}" ]; then
              echo "@adea-ai/ui@${VERSION} is what consumers get"
              exit 0
            fi
            sleep 30
          done
          echo "::error title=latest did not advance::@adea-ai/ui@${VERSION} published but latest is still ${latest:-<unreadable>} after 10 minutes. Another publisher may own this package name — check whether adea-ai/adea is still publishing packages/ui."
          exit 1
