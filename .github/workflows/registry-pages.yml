name: Registry Pages

on:
  push:
    branches: [main]
    paths:
      - 'packages/ui/public/r/**'
      - 'packages/ui/registry.json'
      - '.github/workflows/registry-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-pages-${{ github.ref }}
  cancel-in-progress: false

# Publishes the registry so the install command in the README resolves:
#
#   bunx shadcn@latest add https://adea-ai.github.io/ui/r/button.json
#
# Without this, the documented URL is aspirational. The registry payloads are
# generated from source and committed, so this lane only has to serve them —
# it deliberately does not rebuild, because a page that differs from the
# committed registry is worse than no page at all.
#
# The payloads are not self-contained: each one's `files[].path` names a file the
# CLI fetches from this site, so the tree has to be published too. Copying only the
# JSON — which is what this lane used to do — left every one of the 74 items
# resolving to a 404: the payload served fine, the file it pointed at did not exist,
# and the whole install path failed with an error that named neither. `public/r/**`
# rather than `public/r/*.json` is the fix, and it is the difference between a
# registry that works and one that looks like it works.
jobs:
  publish:
    name: Publish
    if: vars.CI_BILLING_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site/r
          # The whole published tree: the payloads and the files they point at.
          cp -R packages/ui/public/r/. _site/r/
          # A consumer landing on the bare origin should learn what this is
          # rather than see a directory listing.
          cp apps/storybook/styleguide/registry-index.html _site/index.html 2>/dev/null || true
          # The payloads make promises this site can check, and should: every
          # `files[].path` a payload names must exist in what is being published.
          node -e '
            const fs = require("fs")
            const path = require("path")
            const root = process.argv[1]
            let missing = 0
            for (const name of fs.readdirSync(root).filter((n) => n.endsWith(".json"))) {
              const item = JSON.parse(fs.readFileSync(path.join(root, name), "utf8"))
              for (const file of item.files ?? []) {
                if (!fs.existsSync(path.join(root, file.path))) {
                  console.error(`::error title=${item.name} points at an unpublished file::${file.path}`)
                  missing++
                }
              }
            }
            console.log(missing === 0 ? "every payload resolves to a published file" : `${missing} payload file(s) missing`)
            process.exit(missing === 0 ? 0 : 1)
          ' "$PWD/_site/r"

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
