name: Storybook and Registry Pages

on:
  workflow_run:
    workflows: ['Design System Gates']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-pages-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

# The root of GitHub Pages is the built Storybook. Registry payloads
# remain available at /r/** for the documented shadcn install URLs.
#
# A successful Design System Gates run builds `storybook-static` when either
# the Storybook or published registry changes. This workflow consumes only the
# artifact from that exact run and refuses old runs after main has advanced. A
# manual dispatch on main is a fallback that builds the current main revision.
jobs:
  prepare:
    name: Prepare Pages artifact
    if: >-
      vars.CI_BILLING_PAUSED != 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.guard.outputs.publish }}
      source: ${{ steps.guard.outputs.source }}
      head_sha: ${{ steps.guard.outputs.head_sha }}
    steps:
      - name: Check run freshness and select the site source
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          emit_outputs() { printf '%s\n' "$@" >> "$GITHUB_OUTPUT"; }
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$REF" != refs/heads/main ]]; then
              echo 'Manual Pages publishing is restricted to main.'
              emit_outputs 'publish=false' 'source=none'
              exit 0
            fi
            main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            emit_outputs 'publish=true' 'source=manual' "head_sha=$main_sha"
            exit 0
          fi

          if [[ "$RUN_EVENT" != push || "$RUN_BRANCH" != main || \
                "$RUN_REPOSITORY" != "$GITHUB_REPOSITORY" || \
                "$RUN_CONCLUSION" != success ]]; then
            echo 'The completed run is not an eligible same-repository main push.'
            emit_outputs 'publish=false' 'source=none'
            exit 0
          fi

          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" != "$RUN_HEAD_SHA" ]]; then
            echo 'The successful run is stale because main has advanced; skipping deployment.'
            emit_outputs 'publish=false' 'source=none'
            exit 0
          fi

          artifact_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?name=storybook-static" --jq '[.artifacts[] | select(.expired == false)] | length')"
          if [[ "$artifact_count" == 0 ]]; then
            echo 'This successful run did not build a Pages artifact; no deployment is needed.'
            emit_outputs 'publish=false' 'source=none'
            exit 0
          fi
          if [[ "$artifact_count" != 1 ]]; then
            echo "Expected one unexpired storybook-static artifact in run $RUN_ID; found $artifact_count." >&2
            exit 1
          fi

          emit_outputs 'publish=true' 'source=workflow_run' "head_sha=$RUN_HEAD_SHA"

      - name: Checkout the exact source revision
        if: steps.guard.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.guard.outputs.head_sha }}
          persist-credentials: false

      - name: Setup Bun for the manual build
        if: steps.guard.outputs.source == 'manual'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies for the manual build
        if: steps.guard.outputs.source == 'manual'
        run: bun install --frozen-lockfile

      - name: Build Storybook for the manual fallback
        if: steps.guard.outputs.source == 'manual'
        run: bun run storybook:build

      - name: Download this run's Storybook artifact
        if: steps.guard.outputs.source == 'workflow_run'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: storybook-static
          path: apps/storybook/storybook-static/
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify the built workshop exists
        if: steps.guard.outputs.publish == 'true'
        run: test -s apps/storybook/storybook-static/index.html

      - name: Assemble and validate the site
        if: steps.guard.outputs.publish == 'true'
        run: |
          set -euo pipefail
          mkdir -p _site/r _site/registry
          # Storybook is the project-page root. Its relative build assets work
          # under GitHub's /ui/ prefix without changing public registry routes.
          cp -R apps/storybook/storybook-static/. _site/
          cp -R packages/ui/public/r/. _site/r/
          cp apps/storybook/styleguide/registry-index.html _site/registry/index.html

          node - "$PWD/_site/r" <<'NODE'
            const fs = require('fs')
            const path = require('path')
            const root = path.resolve(process.argv[2])
            let missing = 0
            for (const name of fs.readdirSync(root).filter((n) => n.endsWith(".json"))) {
              const item = JSON.parse(fs.readFileSync(path.join(root, name), "utf8"))
              for (const file of item.files ?? []) {
                const target = path.resolve(root, file.path)
                if (!target.startsWith(`${root}${path.sep}`) || !fs.existsSync(target)) {
                  console.error('::error title=' + item.name + ' points at an unpublished file::' + file.path)
                  missing++
                }
              }
            }
            console.log(missing === 0 ? 'every payload resolves to a published file' : missing + ' payload file(s) missing or outside /r')
            process.exit(missing === 0 ? 0 : 1)
          NODE

      - name: Upload the Pages artifact
        if: steps.guard.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
