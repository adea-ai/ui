name: Design System Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types:
      - ready_for_review
      - synchronize
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: design-system-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The gates the generic validation lane cannot see, because they are specific to
# this repository's contract rather than to a TypeScript project:
#
#   registry   the distribution catalogue matches the source, every public export
#              is installable, and no payload names a file that does not exist
#   workshop   the Storybook build succeeds, then every story is loaded in a real
#              browser and checked for accessibility violations and for the
#              interaction each story claims to demonstrate
#
# Both are the checks that make "this is ready to consume" a claim with evidence
# behind it rather than an assertion.
# Draft edits run these gates locally. The ready transition allocates validation
# runners; returning to draft cancels the prior run through the concurrency group.
jobs:
  changes:
    name: Gate scope
    if: vars.CI_BILLING_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      registry: ${{ steps.scope.outputs.registry }}
      workshop: ${{ steps.scope.outputs.workshop }}
      components: ${{ steps.scope.outputs.components }}
    steps:
      - name: Checkout complete history for the immutable PR diff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Verify change classification
        run: bun test ./.github/scripts/design-system-changes.test.ts
      - name: Select needed gates
        id: scope
        run: bun .github/scripts/design-system-changes.mjs
  registry:
    name: Registry
    needs: changes
    if: always() && vars.CI_BILLING_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.changes.result != 'success' || needs.changes.outputs.registry != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild the registry from source
        run: bun run registry:build

      - name: Fail if the committed registry is stale
        run: |
          if ! git diff --exit-code --quiet packages/ui/registry.json packages/ui/public/r; then
            echo '::error title=Registry is stale::registry.json or public/r differs from what the source produces. Run bun run registry:build and commit the result.'
            git --no-pager diff --stat packages/ui/registry.json packages/ui/public/r
            exit 1
          fi

      - name: Validate the registry
        run: bun run registry:validate

      # A consumer's real question is not "is the package small" but "does
      # importing one component pull in the other fifty-eight". Measured, not
      # asserted: two bundles are built and the ratio between them is the gate.
      - name: Build the library, then prove it tree-shakes
        run: |
          bun run --cwd packages/ui build
          bun run check:tree-shaking

      - name: Verify the publishable archive
        run: bun run pack:check

      - name: Verify packed consumers
        run: bun run check:packed-consumer

      - name: Verify packed pure paste model
        run: bun run check:packed-paste-model

      - name: Install headless engines for packed composition contracts
        run: bunx playwright install --with-deps chromium webkit

      - name: Verify packed conversation composition
        run: bun run check:packed-conversation
      - name: Verify packed pane model and renderer
        run: bun run check:packed-layout && bun run check:packed-layout-renderer
      - name: Verify packed appearance interactions and SSR
        run: bun run check:packed-appearance

  # The build is its own job so the slices below do not each repeat it. It is also
  # what makes the sharding honest: every slice runs against the *same* artifact, so
  # a failure in one cannot come from a different build.
  workshop-build:
    name: Workshop build
    needs: changes
    if: always() && vars.CI_BILLING_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.changes.result != 'success' || needs.changes.outputs.workshop != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the workshop
        run: bun run storybook:build

      - name: Upload the built workshop
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: storybook-static
          path: apps/storybook/storybook-static/
          retention-days: 7

  # Loads every story in a real browser and checks it, and presses the things a user
  # presses in the stories that document a behaviour.
  #
  # **Sharded, because coverage grew and the job did not.** The lane was written for
  # two themes over ~236 stories — 472 page loads, which is what the old comment here
  # said — and it now runs seven themes over 431 stories, because the catalogue gained
  # themes and the sample that guards the bridge gained cases. That is 3,017 page
  # loads, a 6.4x increase, and it started exceeding the 45-minute ceiling: the job
  # was *cancelled* at the timeout rather than failing, which reads as an
  # infrastructure problem and hides that the lane was simply too big.
  #
  # Sharding is the fix rather than a smaller sample, because the sample is chosen
  # adversarially (see `SAMPLED_THEMES`) and each case in it was added for a reason.
  # Playwright's `--shard` splits by test, so ten slices preserve the same coverage at
  # roughly a tenth of the unsharded wall time, and a hang in one slice no longer takes the
  # whole lane with it.
  workshop:
    name: Workshop (${{ matrix.shard }})
    if: always() && vars.CI_BILLING_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.changes.result != 'success' || needs.changes.outputs.workshop != 'false')
    needs: [changes, workshop-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A slice that fails must not cancel the others: the report is more useful
      # complete, and the shards are independent.
      fail-fast: false
      matrix:
        shard: ['1/10', '2/10', '3/10', '4/10', '5/10', '6/10', '7/10', '8/10', '9/10', '10/10']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the browser for the accessibility lane
        run: bunx playwright install --with-deps chromium

      - name: Download the built workshop
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: storybook-static
          path: apps/storybook/storybook-static/

      - name: Check this slice's stories for accessibility violations and interactions
        working-directory: apps/storybook
        run: bunx playwright test --shard=${{ matrix.shard }}

      - name: Upload the accessibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: accessibility-report-${{ strategy.job-index }}
          path: apps/storybook/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # These tests bundle the actual component entry themselves. They need neither
  # the workshop build nor its story sweep, so running after shard one only
  # lengthened the critical path.
  components:
    name: Component interactions
    needs: changes
    if: always() && vars.CI_BILLING_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.changes.result != 'success' || needs.changes.outputs.components != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install headless component engines
        run: bunx playwright install --with-deps chromium webkit
      - name: Check controlled component interactions
        run: bun run test:components
      - name: Upload component report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: component-interactions-report
          path: apps/storybook/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # A stable required context covers every matrix member and the independent
  # component lane. always() ensures failed/cancelled prerequisites fail this
  # gate instead of silently skipping it. Worker count can then change without
  # replacing required contexts in the repository ruleset again.
  workshop-gate:
    name: Workshop
    if: always() && vars.CI_BILLING_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [changes, workshop-build, workshop, components]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every workshop and component check
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          WORKSHOP_NEEDED: ${{ needs.changes.outputs.workshop }}
          COMPONENTS_NEEDED: ${{ needs.changes.outputs.components }}
          BUILD_RESULT: ${{ needs.workshop-build.result }}
          STORIES_RESULT: ${{ needs.workshop.result }}
          COMPONENTS_RESULT: ${{ needs.components.result }}
        run: |
          if [ "$SCOPE_RESULT" != success ]; then
            echo '::error::Gate-scope validation failed; full fallback checks cannot hide that failure.'
            exit 1
          fi
          if [ "$SCOPE_RESULT" = success ] && [ "$WORKSHOP_NEEDED" = false ] && [ "$BUILD_RESULT" = skipped ] && [ "$STORIES_RESULT" = skipped ]; then
            BUILD_RESULT=success
            STORIES_RESULT=success
          fi
          if [ "$SCOPE_RESULT" = success ] && [ "$COMPONENTS_NEEDED" = false ] && [ "$COMPONENTS_RESULT" = skipped ]; then
            COMPONENTS_RESULT=success
          fi
          if [ "$BUILD_RESULT" != success ] || [ "$STORIES_RESULT" != success ] || [ "$COMPONENTS_RESULT" != success ]; then
            echo '::error::Workshop build, every story shard, and component interactions must all succeed.'
            exit 1
          fi
