name: Design System Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types:
      - ready_for_review
      - synchronize
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: design-system-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The gates the generic validation lane cannot see, because they are specific to
# this repository's contract rather than to a TypeScript project:
#
#   registry   the distribution catalogue matches the source, every public export
#              is installable, and no payload names a file that does not exist
#   workshop   the Storybook build succeeds, then every story is loaded in a real
#              browser and checked for accessibility violations and for the
#              interaction each story claims to demonstrate
#
# Both are the checks that make "this is ready to consume" a claim with evidence
# behind it rather than an assertion.
# Draft edits run these gates locally. The ready transition allocates validation
# runners; returning to draft cancels the prior run through the concurrency group.
jobs:
  changes:
    name: Gate scope
    if: vars.CI_BILLING_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      registry: ${{ steps.scope.outputs.registry }}
      workshop: ${{ steps.scope.outputs.workshop }}
      components: ${{ steps.scope.outputs.components }}
      pages: ${{ steps.scope.outputs.pages }}
      pagesBuild: ${{ steps.scope.outputs.pagesBuild }}
    steps:
      - name: Checkout complete history for the immutable change diff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Verify change classification, Pages sourcing and component shards
        run: bun test ./.github/scripts/design-system-changes.test.ts ./.github/scripts/check-playwright-runtime.test.ts ./.github/scripts/registry-pages.test.ts ./.github/scripts/component-shards.test.ts
      - name: Select needed gates
        id: scope
        run: bun .github/scripts/design-system-changes.mjs
  registry-core:
    name: Registry core
    needs: changes
    if: always() && vars.CI_BILLING_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.changes.result != 'success' || needs.changes.outputs.registry != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild the registry from source
        run: bun run registry:build

      - name: Fail if the committed registry is stale
        run: |
          if ! git diff --exit-code --quiet packages/ui/registry.json packages/ui/public/r; then
            echo '::error title=Registry is stale::registry.json or public/r differs from what the source produces. Run bun run registry:build and commit the result.'
            git --no-pager diff --stat packages/ui/registry.json packages/ui/public/r
            exit 1
          fi

      - name: Validate the registry
        run: bun run registry:validate

      # A consumer's real question is not "is the package small" but "does
      # importing one component pull in the other fifty-eight". Measured, not
      # asserted: two bundles are built and the ratio between them is the gate.
      - name: Build the library, then prove it tree-shakes
        run: |
          bun run --cwd packages/ui build
          bun run check:tree-shaking

      - name: Verify the publishable archive
        run: bun run pack:check

      # The packed browser contracts run in independent jobs below, against this
      # exact build. The artifact is scoped to this workflow run and expires after
      # a day; it is not reused by later commits or workflow attempts.
      - name: Upload the built UI package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-dist-registry
          path: packages/ui/dist/
          retention-days: 1
          if-no-files-found: error

      - name: Verify packed consumers
        run: bun run check:packed-consumer

      - name: Verify packed pure paste model
        run: bun run check:packed-paste-model

  packed-conversation:
    name: Packed conversation
    needs: [changes, registry-core]
    if: always() && vars.CI_BILLING_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.changes.result != 'success' || needs.changes.outputs.registry != 'false') && needs.registry-core.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 15
    env:
      PLAYWRIGHT_RUNTIME_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare Bun extraction
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the built UI package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ui-dist-registry
          path: packages/ui/dist/

      - name: Verify pinned headless engines
        run: node .github/scripts/check-playwright-runtime.mjs

      - name: Verify packed conversation composition
        run: bun run check:packed-conversation

  packed-layout:
    name: Packed layout
    needs: [changes, registry-core]
    if: always() && vars.CI_BILLING_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.changes.result != 'success' || needs.changes.outputs.registry != 'false') && needs.registry-core.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 20
    env:
      PLAYWRIGHT_RUNTIME_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare Bun extraction
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the built UI package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ui-dist-registry
          path: packages/ui/dist/

      - name: Verify pinned headless engines
        run: node .github/scripts/check-playwright-runtime.mjs

      - name: Verify packed pane model and renderer
        run: bun run check:packed-layout && bun run check:packed-layout-renderer && bun run check:packed-settings-navigation

  packed-appearance:
    name: Packed appearance
    needs: [changes, registry-core]
    if: always() && vars.CI_BILLING_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.changes.result != 'success' || needs.changes.outputs.registry != 'false') && needs.registry-core.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 20
    env:
      PLAYWRIGHT_RUNTIME_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare Bun extraction
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the built UI package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ui-dist-registry
          path: packages/ui/dist/

      - name: Verify pinned headless engines
        run: node .github/scripts/check-playwright-runtime.mjs

      - name: Verify packed appearance interactions and SSR
        run: bun run check:packed-appearance && bun run check:packed-modal-dialog

  packed-native-select:
    name: Packed native select
    needs: [changes, registry-core]
    if: always() && vars.CI_BILLING_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.changes.result != 'success' || needs.changes.outputs.registry != 'false') && needs.registry-core.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 15
    env:
      PLAYWRIGHT_RUNTIME_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare Bun extraction
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the built UI package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ui-dist-registry
          path: packages/ui/dist/

      - name: Verify pinned headless engines
        run: node .github/scripts/check-playwright-runtime.mjs

      - name: Verify native select from the packed artifact
        run: bun run check:packed-native-select

  # Keep one stable required context while its packed browser checks run in
  # parallel. A classifier error takes the full-check path, but cannot itself
  # pass this gate; every required lane must report success.
  registry:
    name: Registry
    needs:
      - changes
      - registry-core
      - packed-conversation
      - packed-layout
      - packed-appearance
      - packed-native-select
    if: always() && vars.CI_BILLING_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the registry build and every packed contract
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          REGISTRY_NEEDED: ${{ needs.changes.outputs.registry }}
          CORE_RESULT: ${{ needs.registry-core.result }}
          CONVERSATION_RESULT: ${{ needs.packed-conversation.result }}
          LAYOUT_RESULT: ${{ needs.packed-layout.result }}
          APPEARANCE_RESULT: ${{ needs.packed-appearance.result }}
          NATIVE_SELECT_RESULT: ${{ needs.packed-native-select.result }}
        run: |
          if [ "$SCOPE_RESULT" != success ]; then
            echo '::error::Gate-scope validation failed; fallback checks cannot hide that failure.'
            exit 1
          fi
          if [ "$REGISTRY_NEEDED" = true ]; then
            for result in "$CORE_RESULT" "$CONVERSATION_RESULT" "$LAYOUT_RESULT" "$APPEARANCE_RESULT" "$NATIVE_SELECT_RESULT"; do
              if [ "$result" != success ]; then
                echo '::error::Registry build and every packed contract must succeed.'
                exit 1
              fi
            done
          elif [ "$REGISTRY_NEEDED" = false ]; then
            for result in "$CORE_RESULT" "$CONVERSATION_RESULT" "$LAYOUT_RESULT" "$APPEARANCE_RESULT" "$NATIVE_SELECT_RESULT"; do
              if [ "$result" != skipped ]; then
                echo '::error::Registry lanes must be skipped when the classifier says they are unnecessary.'
                exit 1
              fi
            done
          else
            echo '::error::Registry classification output is missing or invalid.'
            exit 1
          fi

  # The build is its own job so the slices below do not each repeat it. It is also
  # what makes the sharding honest: every slice runs against the *same* artifact, so
  # a failure in one cannot come from a different build.
  workshop-build:
    name: Workshop build
    needs: changes
    if: always() && vars.CI_BILLING_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.changes.result != 'success' || needs.changes.outputs.workshop != 'false' || needs.changes.outputs.pagesBuild != 'false' || (github.event_name == 'push' && needs.changes.outputs.pages != 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The manager bundle resolves `@adea-ai/ui` through the package's built
      # `dist` — unlike the preview, which reads ui source through the framework's
      # resolve conditions — so the library build has to exist before the workshop
      # one. This mirrors the local and `verify` ordering.
      - name: Build the library
        run: bun run --cwd packages/ui build

      - name: Build the workshop
        run: bun run storybook:build

      - name: Upload the built workshop
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: storybook-static
          path: apps/storybook/storybook-static/
          retention-days: 7

  # Loads every story in a real browser and checks it, and presses the things a user
  # presses in the stories that document a behaviour.
  #
  # **Sharded, because coverage grew and the job did not.** The lane was written for
  # two themes over ~236 stories — 472 page loads, which is what the old comment here
  # said — and it now runs seven themes over 431 stories, because the catalogue gained
  # themes and the sample that guards the bridge gained cases. That is 3,017 page
  # loads, a 6.4x increase, and it started exceeding the 45-minute ceiling: the job
  # was *cancelled* at the timeout rather than failing, which reads as an
  # infrastructure problem and hides that the lane was simply too big.
  #
  # Sharding is the fix rather than a smaller sample, because the sample is chosen
  # adversarially (see `SAMPLED_THEMES`) and each case in it was added for a reason.
  # Playwright's `--shard` splits by test, so ten slices preserve the same coverage at
  # roughly a tenth of the unsharded wall time, and a hang in one slice no longer takes the
  # whole lane with it.
  workshop:
    name: Workshop (${{ matrix.shard }})
    if: always() && vars.CI_BILLING_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.workshop-build.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.workshop != 'false')
    needs: [changes, workshop-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A slice that fails must not cancel the others: the report is more useful
      # complete, and the shards are independent.
      fail-fast: false
      matrix:
        shard: ['1/10', '2/10', '3/10', '4/10', '5/10', '6/10', '7/10', '8/10', '9/10', '10/10']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the browser for the accessibility lane
        run: bunx playwright install --with-deps chromium

      - name: Download the built workshop
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: storybook-static
          path: apps/storybook/storybook-static/

      - name: Check this slice's stories for accessibility violations and interactions
        working-directory: apps/storybook
        run: bunx playwright test --shard=${{ matrix.shard }}

      - name: Upload the accessibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: accessibility-report-${{ strategy.job-index }}
          path: apps/storybook/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # These tests bundle the actual component entry themselves. They need neither
  # the workshop build nor its story sweep, so four independent one-worker shards
  # can run beside the workshop build and story shards.
  components:
    name: Component interactions (${{ matrix.shard }})
    needs: changes
    if: always() && vars.CI_BILLING_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.changes.result != 'success' || needs.changes.outputs.components != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify all component tests partition across four shards
        if: matrix.shard == '1/4'
        working-directory: apps/storybook
        run: bun scripts/check-component-shards.mjs
      - name: Install headless component engines
        run: bunx playwright install --with-deps chromium webkit
      - name: Check controlled component interactions
        working-directory: apps/storybook
        run: bun run test:components --shard=${{ matrix.shard }}
      - name: Upload component report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: component-interactions-report-${{ strategy.job-index }}
          path: apps/storybook/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # A stable required context covers every matrix member and the independent
  # component lane. always() ensures failed/cancelled prerequisites fail this
  # gate instead of silently skipping it. Worker count can then change without
  # replacing required contexts in the repository ruleset again.
  workshop-gate:
    name: Workshop
    if: always() && vars.CI_BILLING_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [changes, workshop-build, workshop, components]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every workshop and component check
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          EVENT_NAME: ${{ github.event_name }}
          WORKSHOP_NEEDED: ${{ needs.changes.outputs.workshop }}
          PAGES_NEEDED: ${{ needs.changes.outputs.pages }}
          PAGES_BUILD_NEEDED: ${{ needs.changes.outputs.pagesBuild }}
          COMPONENTS_NEEDED: ${{ needs.changes.outputs.components }}
          BUILD_RESULT: ${{ needs.workshop-build.result }}
          STORIES_RESULT: ${{ needs.workshop.result }}
          COMPONENTS_RESULT: ${{ needs.components.result }}
        run: |
          if [ "$SCOPE_RESULT" != success ]; then
            echo '::error::Gate-scope validation failed; full fallback checks cannot hide that failure.'
            exit 1
          fi
          if [ "$SCOPE_RESULT" = success ] && [ "$WORKSHOP_NEEDED" = false ]; then
            if [ "$STORIES_RESULT" = skipped ]; then STORIES_RESULT=success; fi
          fi
          BUILD_REQUIRED=false
          if [ "$WORKSHOP_NEEDED" = true ] || [ "$PAGES_BUILD_NEEDED" = true ] || { [ "$EVENT_NAME" = push ] && [ "$PAGES_NEEDED" = true ]; }; then BUILD_REQUIRED=true; fi
          if [ "$SCOPE_RESULT" = success ] && [ "$BUILD_REQUIRED" = false ] && [ "$BUILD_RESULT" = skipped ]; then BUILD_RESULT=success; fi
          if [ "$SCOPE_RESULT" = success ] && [ "$COMPONENTS_NEEDED" = false ] && [ "$COMPONENTS_RESULT" = skipped ]; then
            COMPONENTS_RESULT=success
          fi
          if [ "$BUILD_RESULT" != success ] || [ "$STORIES_RESULT" != success ] || [ "$COMPONENTS_RESULT" != success ]; then
            echo '::error::Workshop build, every story shard, and component interactions must all succeed.'
            exit 1
          fi
